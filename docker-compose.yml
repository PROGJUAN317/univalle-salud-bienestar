# Entorno local completo: base de datos PostgreSQL + aplicación.
# Uso:  docker compose up --build
# Las contraseñas vienen del archivo .env (copiado de .env.example); no se guardan aquí.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: univalle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d univalle"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/univalle
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
    ports:
      - "3000:3000"

volumes:
  pgdata:
